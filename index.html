<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENG.ISMAIL AL-JIBOORY | Aviation Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;1000&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: #030814;
      background-image: radial-gradient(circle at top, #0c1e3d 0%, #030814 85%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* شاشة الدخول - الطيران */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #02050e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }

    .plane-icon {
      font-size: 55px;
      margin-bottom: 10px;
      animation: flyIn 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      filter: drop-shadow(0 0 15px #00a2ff);
    }

    .intro-title {
      font-size: 32px;
      font-weight: 1000;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 15px #00a2ff, 0 0 30px #0055ff;
      animation: fadeInText 1.8s ease forwards;
      text-align: center;
      padding: 0 15px;
    }

    .intro-sub {
      font-size: 14px;
      color: #00d2ff;
      letter-spacing: 2px;
      margin-top: 10px;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
    }

    @keyframes flyIn {
      0% { transform: translateY(80px) scale(0.3); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes fadeInText {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* الكارت الرئيسي */
    .container {
      width: 100%;
      max-width: 450px;
      background: rgba(8, 20, 42, 0.82);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 162, 255, 0.35);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 162, 255, 0.25);
      animation: cardAppear 1s ease-out forwards;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .profile-box {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff, #0055ff);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
    }

    .profile-box span {
      font-size: 55px;
    }

    h1 {
      font-size: 22px;
      font-weight: 1000;
      color: #00d2ff;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 13px;
      color: #9cb3d9;
      margin-bottom: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 14px;
      color: #f0f3f7;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(0, 162, 255, 0.18);
      border-color: #00d2ff;
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      transform: translateY(-2px);
    }

    .btn-fb {
      background: rgba(24, 119, 242, 0.15);
      border-color: rgba(24, 119, 242, 0.4);
    }

    .btn-fb:hover {
      background: rgba(24, 119, 242, 0.35);
      border-color: #1877f2;
      box-shadow: 0 0 20px rgba(24, 119, 242, 0.6);
    }

    .btn-wa {
      background: rgba(37, 211, 102, 0.15);
      border-color: rgba(37, 211, 102, 0.4);
    }

    .btn-wa:hover {
      background: rgba(37, 211, 102, 0.35);
      border-color: #25d366;
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.6);
    }

    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #00a2ff;
      color: #fff;
      font-weight: 800;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(0, 162, 255, 0.8);
    }

    .toast.show {
      bottom: 30px;
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول مع طائرة والانميشن -->
  <div id="intro-screen" onclick="playVoice()">
    <div class="plane-icon">✈️</div>
    <div class="intro-title">ENG.ISMAIL AL-JIBOORY</div>
    <div class="intro-sub">AVIATION ENGINEER ⚡</div>
  </div>

  <!-- الكارت الرئيسي للموقع -->
  <div class="container">
    <div class="profile-box">
      <span>✈️</span>
    </div>
    <h1>ENG.ISMAIL AL-JIBOORY</h1>
    <p class="subtitle">AVIATION & AEROSPACE ENGINEERING ✈️</p>

    <div class="links-list">
      <!-- حساب WhatsApp المباشر -->
      <a href="https://wa.me/9647705365546" target="_blank" class="btn btn-wa">
        <span>💬 التواصل عبر WhatsApp</span>
        <span>WhatsApp ↗</span>
      </a>

      <!-- حساب Facebook المباشر -->
      <a href="https://www.facebook.com/share/1DjwsJ1vNV/" target="_blank" class="btn btn-fb">
        <span>🌐 حساب الـ Facebook</span>
        <span>Facebook ↗</span>
      </a>

      <!-- زر نسخ رابط الواتساب -->
      <button class="btn" onclick="copyText('https://wa.me/9647705365546')">
        <span>📋 نسخ رابط الواتساب</span>
        <span>Copy</span>
      </button>

      <!-- زر نسخ رابط الموقع -->
      <button class="btn" onclick="copyText('https://NEXT11DEV.github.io/IPANEXTDEV/')">
        <span>🌐 نسخ رابط الموقع</span>
        <span>Copy</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast">تم النسخ بنجاح! ⚡</div>

  <script>
    let voicePlayed = false;

    // الصوت الترحيبي بالعربية
    function playVoice() {
      if (!voicePlayed && 'speechSynthesis' in window) {
        let msg = new SpeechSynthesisUtterance("أهلاً بكم في موقع المهندس إسماعيل الجبوري");
        msg.lang = 'ar-SA';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
        voicePlayed = true;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.body.addEventListener('click', playVoice, { once: true });
      
      setTimeout(() => {
        playVoice();
        document.getElementById('intro-screen').classList.add('fade-out');
        document.body.style.overflow = 'auto';
      }, 2500);
    });

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        let toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      });
    }
  </script>

</body>
</html>
